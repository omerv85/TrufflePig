<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f4e4cc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>TrufflePig</title>
  <meta name="description" content="Be a little pink pig in an endless pastel forest. Follow the yellow scent mist and dig up hidden truffles." />
  <!-- Link previews (WhatsApp, Telegram, Facebook, X ...) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TrufflePig" />
  <meta property="og:title" content="TrufflePig" />
  <meta property="og:description" content="Be a little pink pig in an endless pastel forest. Follow your nose to the truffles!" />
  <meta property="og:url" content="https://trufflepig.o-vertman.workers.dev/" />
  <meta property="og:image" content="https://trufflepig.o-vertman.workers.dev/share.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A pink pig seen from behind in a sunny pastel forest, with yellow truffle mist rising by a tree" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="touch"></div>
  <div id="sniff" aria-hidden="true"></div>

  <div id="hud">
    <div id="map-wrap">
      <canvas id="minimap" aria-label="Minimap"></canvas>
    </div>
    <div id="right">
      <div id="counter" aria-label="Truffles collected">
        <svg viewBox="0 0 32 32" class="truffle-icon" aria-hidden="true">
          <circle cx="16" cy="17" r="11" fill="#4a3530" />
          <circle cx="10" cy="11" r="4" fill="#5a423b" />
          <circle cx="19" cy="9" r="4.5" fill="#5a423b" />
          <circle cx="25" cy="16" r="4" fill="#4f3a34" />
          <circle cx="7" cy="19" r="4" fill="#4f3a34" />
          <circle cx="14" cy="25" r="4.5" fill="#463230" />
          <circle cx="22" cy="24" r="4" fill="#463230" />
          <circle cx="12" cy="13" r="1.3" fill="#8a6c62" />
          <circle cx="19" cy="14" r="1" fill="#8a6c62" />
          <circle cx="16" cy="20" r="1.2" fill="#8a6c62" />
          <circle cx="23" cy="19" r="0.9" fill="#8a6c62" />
        </svg>
        <span id="truffle-count">0</span>
      </div>
      <button id="pause-btn" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" /><rect x="14" y="5" width="4" height="14" rx="1.5" /></svg>
      </button>
    </div>
  </div>

  <div id="start">
    <div class="card">
      <h1>TrufflePig</h1>
      <p>Follow the truffle smell!</p>
      <button id="play">Tap to start</button>
      <div id="version">v0.4</div>
    </div>
  </div>

  <button id="fs-btn" class="hidden" aria-label="Full screen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg>
  </button>

  <div id="pause" class="overlay hidden" role="dialog" aria-label="Game paused">
    <div class="card">
      <div class="banner">Game paused</div>
      <button id="resume" class="big">Resume</button>
      <button id="sound" class="toggle" aria-pressed="true">Sound: on</button>
    </div>
  </div>

  <div id="rotate" class="overlay hidden" role="alert">
    <div class="rotate-inner">
      <svg class="phone" viewBox="0 0 64 100" aria-hidden="true">
        <rect x="4" y="4" width="56" height="92" rx="10" />
        <circle cx="32" cy="86" r="4" />
      </svg>
      <p>Turn your phone sideways</p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
