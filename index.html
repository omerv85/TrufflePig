<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f4e4cc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>TrufflePig</title>
  <meta name="description" content="Be a little pink pig in an endless pastel forest. Follow the yellow scent mist and dig up hidden truffles." />
  <!-- Link previews (WhatsApp, Telegram, Facebook, X ...) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TrufflePig" />
  <meta property="og:title" content="TrufflePig" />
  <meta property="og:description" content="Be a little pink pig in an endless pastel forest. Follow your nose to the truffles!" />
  <meta property="og:url" content="https://trufflepig.o-vertman.workers.dev/" />
  <meta property="og:image" content="https://trufflepig.o-vertman.workers.dev/share.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A pink pig seen from behind in a sunny pastel forest, with yellow truffle mist rising by a tree" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="vignette"></div>
  <div id="touch"></div>
  <div id="sniff" aria-hidden="true"></div>

  <div id="hud">
    <div id="map-wrap">
      <canvas id="minimap" aria-label="Minimap"></canvas>
    </div>
    <div id="right">
      <!-- Sky dial: a half-moon window over a little treeline; the disc behind it turns with the
           day and night cycle, carrying the sun down out of view and the moon and stars up. -->
      <svg id="sky-dial" viewBox="0 0 84 46" aria-hidden="true">
        <defs>
          <clipPath id="dial-win"><path d="M12 38 A30 30 0 0 1 72 38 Z" /></clipPath>
        </defs>
        <g clip-path="url(#dial-win)">
          <rect id="dial-sky" x="10" y="6" width="64" height="34" fill="#a8d2f0" />
          <g id="dial-disc">
            <circle cx="42" cy="18" r="7.5" fill="#ffd36b" />
            <circle cx="42" cy="18" r="10" fill="#ffe7a3" opacity="0.45" />
            <circle cx="42" cy="58" r="6.5" fill="#f6f1dc" />
            <circle id="dial-bite" cx="45.5" cy="55.5" r="5.5" fill="#a8d2f0" />
            <circle cx="29" cy="60" r="1.1" fill="#fff" />
            <circle cx="55" cy="63" r="1" fill="#fff" />
            <circle cx="35" cy="68" r="0.9" fill="#fff" />
            <circle cx="51" cy="51" r="0.8" fill="#fff" />
          </g>
        </g>
        <path d="M12 38 A30 30 0 0 1 72 38" fill="none" stroke="#fff" stroke-width="3" />
        <path d="M20 38 l4.5 -8 l4.5 8 Z M56 38 l5.5 -10 l5.5 10 Z M48 38 l3.5 -6 l3.5 6 Z" class="dial-ground" fill="#7fae7a" />
        <path d="M6 38.5 H78" class="dial-ground" stroke="#7fae7a" stroke-width="5" stroke-linecap="round" />
      </svg>
      <div id="counter" aria-label="Truffles collected">
        <svg viewBox="0 0 32 32" class="truffle-icon" aria-hidden="true">
          <circle cx="16" cy="17" r="11" fill="#4a3530" />
          <circle cx="10" cy="11" r="4" fill="#5a423b" />
          <circle cx="19" cy="9" r="4.5" fill="#5a423b" />
          <circle cx="25" cy="16" r="4" fill="#4f3a34" />
          <circle cx="7" cy="19" r="4" fill="#4f3a34" />
          <circle cx="14" cy="25" r="4.5" fill="#463230" />
          <circle cx="22" cy="24" r="4" fill="#463230" />
          <circle cx="12" cy="13" r="1.3" fill="#8a6c62" />
          <circle cx="19" cy="14" r="1" fill="#8a6c62" />
          <circle cx="16" cy="20" r="1.2" fill="#8a6c62" />
          <circle cx="23" cy="19" r="0.9" fill="#8a6c62" />
        </svg>
        <span id="truffle-count">0</span>
      </div>
      <button id="pause-btn" aria-label="Pause">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" /><rect x="14" y="5" width="4" height="14" rx="1.5" /></svg>
      </button>
    </div>
  </div>

  <div id="start">
    <div class="card">
      <h1>TrufflePig</h1>
      <p>Follow the truffle smell!</p>
      <button id="play">Tap to start</button>
      <div id="version">v0.24</div>
    </div>
  </div>

  <button id="fs-btn" class="hidden" aria-label="Full screen">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" /></svg>
  </button>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="wa-icon" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" /></symbol>
  </svg>

  <div id="flash" aria-hidden="true"></div>

  <div id="pause" class="overlay hidden" role="dialog" aria-label="Game paused">
    <div class="card">
      <div class="banner">Game paused</div>
      <button id="resume" class="big">Resume</button>
      <button id="sound" class="toggle" aria-pressed="true">Sound: on</button>
      <button id="pause-share" class="wa"><svg aria-hidden="true"><use href="#wa-icon" /></svg>Share</button>
    </div>
  </div>

  <div id="gameover" class="overlay hidden" role="dialog" aria-label="Game over">
    <div class="card">
      <div class="banner">Game over</div>
      <p class="why" id="go-why">The wolf got you!</p>
      <p class="score">You found <b id="go-count">0</b> <span id="go-word">truffles</span></p>
      <div class="row">
        <button id="go-share" class="wa"><svg aria-hidden="true"><use href="#wa-icon" /></svg>Share</button>
        <button id="new-game" class="big">New game</button>
      </div>
    </div>
  </div>

  <div id="rotate" class="overlay hidden" role="alert">
    <div class="rotate-inner">
      <svg class="phone" viewBox="0 0 64 100" aria-hidden="true">
        <rect x="4" y="4" width="56" height="92" rx="10" />
        <circle cx="32" cy="86" r="4" />
      </svg>
      <p>Turn your phone sideways</p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
